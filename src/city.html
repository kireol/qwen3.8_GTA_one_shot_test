<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MERIDIAN — procedural city walkabout</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070b}
  body{font-family:"Helvetica Neue",Helvetica,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#e7ecf2}
  canvas{display:block}
  #stage{position:fixed;inset:0}
  #stage canvas{width:100%;height:100%}

  /* ---------- atmosphere overlays ---------- */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
       background:radial-gradient(ellipse 78% 72% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.60) 100%);
       mix-blend-mode:multiply;transition:opacity .5s}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.05;
       background-image:repeating-conic-gradient(#fff 0 .00025turn,transparent 0 .0005turn);
       background-size:170px 170px;mix-blend-mode:overlay}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .8s ease}
  #hud.on{opacity:1}
  .lbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#8b9bad}
  #dial{position:absolute;left:30px;bottom:26px}
  #clock{font-size:34px;font-weight:200;letter-spacing:.06em;line-height:1;color:#f2f5f8;
         font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(0,0,0,.75)}
  #clock span{font-size:12px;font-weight:400;letter-spacing:.22em;color:#93a4b6;margin-left:8px;vertical-align:5px}
  #dist{margin-top:9px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#d9e2ea;text-shadow:0 1px 10px rgba(0,0,0,.8)}
  #tod{margin-top:6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#77899b}

  #hint{position:absolute;left:30px;top:28px;font-size:11px;line-height:2.05;letter-spacing:.03em;color:#a9b8c6;
        text-shadow:0 1px 8px rgba(0,0,0,.9);transition:opacity 1.2s ease}
  #hint kbd{display:inline-block;min-width:19px;padding:1px 5px;margin-right:7px;border-radius:3px;
        background:rgba(230,240,250,.10);border:1px solid rgba(230,240,250,.16);
        font:inherit;font-size:10px;color:#eef3f8;text-align:center}
  #hint.dim{opacity:.26}

  #toast{position:absolute;left:50%;bottom:15.5%;transform:translateX(-50%);text-align:center;opacity:0;
         transition:opacity .9s ease}
  #toast .k{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:#c8a877}
  #toast .v{font-size:29px;font-weight:200;letter-spacing:.13em;text-transform:uppercase;margin-top:6px;
            color:#f6f9fc;text-shadow:0 3px 26px rgba(0,0,0,.85)}
  #toast.on{opacity:1}

  #mapwrap{position:absolute;right:26px;bottom:26px;width:184px;height:184px;border-radius:50%;
           overflow:hidden;box-shadow:0 0 0 1px rgba(233,240,248,.14),0 14px 40px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.5)}
  #map{width:184px;height:184px;display:block;filter:saturate(.85) contrast(1.05)}
  #mapring{position:absolute;inset:0;border-radius:50%;pointer-events:none;
           box-shadow:inset 0 0 22px rgba(0,0,0,.75)}
  #north{position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:8px;letter-spacing:.2em;color:#dfe7ee;
         text-shadow:0 1px 6px #000}
  #mute{position:absolute;right:28px;bottom:220px;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#6d7f91;opacity:0;transition:opacity .6s}
  #mute.on{opacity:1}

  /* ---------- boot / pause ---------- */
  #boot{position:fixed;inset:0;z-index:30;background:
        radial-gradient(ellipse 90% 70% at 50% 118%,#1b2740 0%,#0a1020 46%,#04060a 100%);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        transition:opacity .9s ease,visibility .9s}
  #boot.gone{opacity:0;visibility:hidden;pointer-events:none}
  #boot h1{font-size:60px;font-weight:100;letter-spacing:.30em;text-indent:.30em;color:#f4f7fb;
           text-shadow:0 0 60px rgba(120,170,255,.30)}
  #boot h2{margin-top:10px;font-size:10px;font-weight:400;letter-spacing:.42em;text-transform:uppercase;color:#7f93a8}
  #bar{margin-top:44px;width:320px;height:1px;background:rgba(210,226,240,.16);overflow:hidden}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#c98f4a,#e8cfa6);transition:width .25s ease}
  #bootmsg{margin-top:14px;height:14px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#6b7d90;
           font-variant-numeric:tabular-nums}
  #enter{margin-top:34px;padding:13px 30px;border:1px solid rgba(232,240,248,.34);border-radius:2px;
         font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#eef4fa;cursor:pointer;opacity:0;
         transition:opacity .6s,background .25s,border-color .25s;pointer-events:none}
  #enter.on{opacity:1;pointer-events:auto}
  #enter:hover{background:rgba(232,240,248,.10);border-color:rgba(232,240,248,.7)}
  #keys{margin-top:30px;display:flex;gap:30px;opacity:0;transition:opacity .7s}
  #keys.on{opacity:1}
  #keys div{font-size:10px;letter-spacing:.16em;color:#7f93a8}
  #keys b{display:block;font-weight:400;font-size:14px;letter-spacing:.08em;color:#dce6f0;margin-bottom:5px}
  #fade{position:fixed;inset:0;z-index:20;background:#04060a;opacity:1;pointer-events:none;transition:opacity 1.6s ease}
  #fade.up{opacity:0}
  #note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;max-width:520px;text-align:center;
        font-size:13px;line-height:1.9;letter-spacing:.05em;color:#c3d0dc;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<div id="grain"></div>

<div id="hud">
  <div id="hint">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</div>
    <div><kbd>&#8679;</kbd> sprint &nbsp; <kbd>SPC</kbd> hop</div>
    <div><kbd>MOUSE</kbd> look around</div>
    <div><kbd>V</kbd> camera &nbsp; <kbd>T</kbd> time</div>
    <div><kbd>H</kbd> hide keys &nbsp; <kbd>M</kbd> sound</div>
  </div>
  <div id="dial">
    <div id="clock">07:30<span id="ampm">AM</span></div>
    <div id="dist">Old Town</div>
    <div id="tod">early morning</div>
  </div>
  <div id="toast"><div class="k">entering</div><div class="v">Old Town</div></div>
  <div id="mapwrap"><canvas id="map" width="368" height="368"></canvas><div id="mapring"></div><div id="north">N</div></div>
  <div id="mute">sound off</div>
</div>

<div id="boot">
  <h1>MERIDIAN</h1>
  <h2>a procedural city you can walk</h2>
  <div id="bar"><i></i></div>
  <div id="bootmsg">waking up</div>
  <div id="enter">click to walk</div>
  <div id="keys">
    <div><b>WASD</b>walk</div>
    <div><b>SHIFT</b>sprint</div>
    <div><b>MOUSE</b>look</div>
    <div><b>V</b>camera</div>
    <div><b>T</b>time</div>
  </div>
</div>
<div id="fade"></div>
<div id="note"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

  skyMesh.position.copy(camera.position);        /* matrixAutoUpdate is off */
  skyMesh.updateMatrix();
  updateHUD();
  drawMap();
  mixAudio(dt);
  renderer.render(scene, camera);
}
function frame() {
  if (!live) return;
  try { stepFrame(); }
  catch (e) {
    if (window.console) console.error(e);
    fatal('Runtime error: ' + (e && e.message ? e.message : e));
    throw e;
  }
  requestAnimationFrame(frame);
}
runLadder();
})();
</script>
